name: store_checker_plus
description: Finds where the app was installed from, such as Google Play, the App Store, TestFlight, other Android stores or a local install.
version: 2.0.0
homepage: https://github.com/tologonkudaiberdiuulu/store_checker_plus

topics:
  - store
  - installer
  - testflight
  - google-play

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: store.checker.store_checker_plus
        pluginClass: StoreCheckerPlusPlugin
      ios:
        pluginClass: StoreCheckerPlusPlugin
      macos:
        pluginClass: StoreCheckerPlusPlugin
